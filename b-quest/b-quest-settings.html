    // ═══════════════════════════════════════════
    // Links — task link slots (label / on-off / order), rule 'quest_links'
    // Slot N always maps to the same b_quest_list column (BQ_LINK_COLUMNS
    // in b-quest.js); reordering only changes display order, and turning a
    // slot off only hides it — nothing here ever touches task data.
    // ═══════════════════════════════════════════
    function linkBuffer() {
        return normalizeQuestLinks(linkChanges.quest_links ?? originalConfig.quest_links);
    }

    // Active slots whose shown label (empty → "Link N") collides with
    // another active slot's, case/space-insensitive.
    function linkDuplicateSlots(list) {
        const seen = {}, dup = new Set();
        list.filter(l => l.active).forEach(l => {
            const key = questLinkLabel(l).trim().toLowerCase();
            if (seen[key]) { dup.add(seen[key]); dup.add(l.slot); }
            else seen[key] = l.slot;
        });
        return dup;
    }

    function renderLinksSection() {
        const list = linkBuffer();
        const dup = linkDuplicateSlots(list);
        document.getElementById('link-list').innerHTML = list.map(l => `
            <div class="cfg-row ${l.active ? '' : 'is-inactive'}" data-slot="${l.slot}"
                 draggable="true"
                 ondragstart="dragStart(event, 'link', '${l.slot}')" ondragend="dragEnd(event)"
                 ondragover="event.preventDefault()" ondragenter="dragEnterRow(event, 'link', '${l.slot}')" ondragleave="dragLeaveRow(event)"
                 ondrop="dropOnRow(event, 'link', '${l.slot}')">
                <div class="cfg-drag-handle cfg-col-drag"><i class="bi bi-grip-vertical"></i>${moveBtns('link', String(l.slot))}</div>
                <span class="link-slot-tag">Link ${l.pos}</span>
                <input class="cfg-name-input cfg-col-name ${dup.has(l.slot) ? 'is-invalid' : ''}" maxlength="${BQ_LINK_LABEL_MAX}"
                       placeholder="Link ${l.pos}" value="${esc(l.label)}" oninput="onLinkField(${l.slot}, 'label', this.value)">
                <div class="cfg-mini-toggle-wrap cfg-col-toggle">
                    <label class="bq-toggle small">
                        <input type="checkbox" ${l.active ? 'checked' : ''} onchange="onLinkField(${l.slot}, 'active', this.checked)">
                        <span class="bq-slider"></span>
                    </label>
                </div>
            </div>
        `).join('');
    }

    function onLinkField(slot, field, value) {
        const list = linkBuffer();
        list.find(l => l.slot === slot)[field] = value;
        linkChanges.quest_links = list;
        markDirty('section-links');
        if (field === 'active') { renderLinksSection(); return; }
        // Label typing: no re-render (would drop the caret) — just refresh
        // the duplicate marks in place.
        const dup = linkDuplicateSlots(linkBuffer());
        document.querySelectorAll('#link-list .cfg-row').forEach(row => {
            row.querySelector('.cfg-name-input').classList.toggle('is-invalid', dup.has(Number(row.dataset.slot)));
        });
    }

    // Runs before saveAll writes anything. Returns false to abort the save
    // (duplicate labels, or the user backed out of hiding links in use).
    async function validateLinksBeforeSave() {
        if (!linkChanges.quest_links) return true;
        const list = linkBuffer();
        if (linkDuplicateSlots(list).size) {
            renderLinksSection();
            await Swal.fire('Duplicate link label', 'Each link that is turned on needs its own label.', 'warning');
            return false;
        }
        const before = normalizeQuestLinks(originalConfig.quest_links);
        const turnedOff = list.filter(l => !l.active && before.find(b => b.slot === l.slot).active);
        if (turnedOff.length) {
            const counts = await Promise.all(turnedOff.map(l => {
                const col = BQ_LINK_COLUMNS[l.slot];
                return supabaseClient.from('b_quest_list').select('id', { count: 'exact', head: true }).not(col, 'is', null).neq(col, '');
            }));
            const inUse = turnedOff
                .map((l, i) => ({ label: questLinkLabel(before.find(b => b.slot === l.slot)), n: counts[i].error ? null : (counts[i].count || 0) }))
                .filter(u => u.n !== 0);
            if (inUse.length) {
                const res = await Swal.fire({
                    icon: 'warning',
                    title: 'Hide these links?',
                    html: inUse.map(u => `<b>${esc(u.label)}</b> — ${u.n === null ? 'may be in use on some tasks' : `used on ${u.n} task${u.n > 1 ? 's' : ''}`}`).join('<br>')
                        + '<br><br>They will be hidden, not deleted. Turning them back on shows them again.',
                    showCancelButton: true,
                    confirmButtonText: 'Hide',
                    cancelButtonText: 'Cancel'
                });
                if (!res.isConfirmed) return false;
            }
        }
        linkChanges.quest_links = list.map(({ slot, label, active }) => ({ slot, label, active })); // normalized (trimmed), without derived pos
        return true;
    }

    // ═══════════════════════════════════════════
    // List page — Filter Defaults (Role/Status/Type pre-selected + Deadline
    // range). Two separate b-quest-setting rules (list_filter_defaults,
    // list_deadline_default) staged in the same filterDefaultsChanges
    // bucket, so both share one dirty-dot/section.
    // ═══════════════════════════════════════════
    function filterDefaultsBuffer() {
        return { status: [], type: [], role: '', ...originalConfig.list_filter_defaults, ...filterDefaultsChanges.list_filter_defaults };
    }

    function deadlineDefaultBuffer() {
        return {
            lower: { mode: 'none', value: 0 }, upper: { mode: 'none', value: 0 },
            ...originalConfig.list_deadline_default, ...filterDefaultsChanges.list_deadline_default
        };
    }

    function renderFilterDefaultsSection() {
        const fd = filterDefaultsBuffer();

        renderFdRoleSeg();

        // Status/Type reuse the same createMultiSelect popover the List
        // page's own filter bar uses — setValues() just syncs the trigger's
        // displayed label ("All" / "N selected") to the current buffer, it
        // doesn't fire onChange (see multi-select.js), so this can't loop
        // back into re-staging a change on every render.
        if (fdStatusFilter) fdStatusFilter.setValues(fd.status || []);
        if (fdTypeFilter) fdTypeFilter.setValues(fd.type || []);

        renderDeadlineDefaultFields();
    }

    // Role default — shared sliding role-segment control (createRoleSegControl
    // in b-quest.js, same mechanic as List/Assignment's own role-seg), wired
    // to stage into filterDefaultsChanges instead of calling setRoleFilter.
    // getActiveValue reads the staged buffer (not DOM state) since that's
    // this page's actual source of truth — matters on first render (restores
    // a previously-saved default with no prior DOM state to fall back on)
    // and on Cancel (buffer resets, DOM must follow, not the other way
    // round). Rebuilds every render so a role added/renamed/recolored
    // earlier in this same Settings session shows up immediately.
    const fdRoleSeg = createRoleSegControl({
        wrapId: 'fdRoleSegWrap', outerId: 'fdRoleSegOuter', sliderId: 'fdRoleSegSlider', btnClass: 'fd-role-seg-btn',
        getButtons: () => [{ label: 'All', value: '', icon: '', color: '' }, ...roleBuffer().filter(r => !r._deleted).map(r => ({ label: r.name, value: r.id, icon: r.icon || 'bi-person-workspace', color: r.color || '#64748b' }))],
        getActiveValue: () => filterDefaultsBuffer().role || '',
        onSelect: value => {
            filterDefaultsChanges.list_filter_defaults = { ...filterDefaultsBuffer(), role: value };
            markDirty('section-filterdefaults');
            renderFilterDefaultsSection();
        }
    });
    function renderFdRoleSeg() { fdRoleSeg.render(); }

    // Status/Type default pickers — initialized once (trigger elements are
    // static HTML, always present), getOptions() re-reads the live buffer
    // each time the popover opens so a Status/Type added earlier in this
    // same Settings session shows up without a page reload.
    function setupFilterDefaultMultiSelects() {
        fdStatusFilter = createMultiSelect({
            trigger: document.getElementById('wrap-fdStatus'),
            label: 'Status',
            showTag: false, // .fd-hrow already shows "Status" as its own label
            getOptions: () => statusBuffer().filter(s => !s._deleted).map(s => ({ value: s.id, label: s.name })),
            onChange: (values) => {
                filterDefaultsChanges.list_filter_defaults = { ...filterDefaultsBuffer(), status: values };
                markDirty('section-filterdefaults');
            }
        });
        fdTypeFilter = createMultiSelect({
            trigger: document.getElementById('wrap-fdType'),
            label: 'Type',
            showTag: false, // .fd-hrow already shows "Type" as its own label
            getOptions: () => typeBuffer().filter(t => !t._deleted).map(t => ({ value: t.name, label: t.name })),
            onChange: (values) => {
                filterDefaultsChanges.list_filter_defaults = { ...filterDefaultsBuffer(), type: values };
                markDirty('section-filterdefaults');
            }
        });
    }

    function renderDeadlineDefaultFields() {
        const dd = deadlineDefaultBuffer();
        const lowerSeg = document.getElementById('fdLowerModeSeg');
        if (!lowerSeg) return;
        renderDeadlineModeSeg('lower', dd.lower.mode);
        renderDeadlineModeSeg('upper', dd.upper.mode);
        const lowerVal = document.getElementById('fdLowerValue');
        const upperVal = document.getElementById('fdUpperValue');
        lowerVal.value = dd.lower.value ?? 0;
        lowerVal.style.display = dd.lower.mode === 'none' ? 'none' : 'inline-block';
        upperVal.value = dd.upper.value ?? 0;
        upperVal.style.display = dd.upper.mode === 'none' ? 'none' : 'inline-block';
        const preview = computeDeadlinePreview(dd);
        document.getElementById('fdDeadlinePreview').innerHTML = `
            <i class="bi bi-calendar-range"></i>
            <span class="fd-preview-chip ${preview.lo === 'No limit' ? 'is-unset' : ''}">${esc(preview.lo)}</span>
            <i class="bi bi-arrow-right"></i>
            <span class="fd-preview-chip ${preview.hi === 'No limit' ? 'is-unset' : ''}">${esc(preview.hi)}</span>
        `;
        document.getElementById('fdDeadlineSummary').textContent = deadlineSummaryText(dd);
    }

    // Positions the sliding pill the same JS-measured way as
    // .fd-role-seg-slider — offsetLeft/offsetWidth of whichever button is
    // active, so it works regardless of each label's own width.
    function renderDeadlineModeSeg(bound, mode) {
        const seg = document.getElementById(bound === 'lower' ? 'fdLowerModeSeg' : 'fdUpperModeSeg');
        if (!seg) return;
        seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
        const active = seg.querySelector('button.on');
        const slider = seg.querySelector('.fd-mode-seg-slider');
        if (active && slider) {
            slider.style.left = active.offsetLeft + 'px';
            slider.style.width = active.offsetWidth + 'px';
        }
    }

    function onDeadlineModeClick(bound, mode) {
        const dd = deadlineDefaultBuffer();
        filterDefaultsChanges.list_deadline_default = { ...dd, [bound]: { mode, value: dd[bound].value ?? 0 } };
        markDirty('section-filterdefaults');
        renderDeadlineDefaultFields();
    }

    function onDeadlineBoundChange(bound) {
        const dd = deadlineDefaultBuffer();
        const value = Number(document.getElementById(bound === 'lower' ? 'fdLowerValue' : 'fdUpperValue').value || 0);
        filterDefaultsChanges.list_deadline_default = { ...dd, [bound]: { mode: dd[bound].mode, value } };
        markDirty('section-filterdefaults');
        renderDeadlineDefaultFields();
    }

    // Translates a bound's raw Day/Month offset into plain language next to
    // its own number input — "0" alone doesn't read as "today"/"this month"
    // without stopping to think about it. Month is never phrased "ahead":
    // both Lower and Upper month bounds only ever count backward from the
    // current month (see computeDeadlinePreview's resolve()), so "ago"/
    // "this month" covers every case; only Day distinguishes ago vs ahead.
    function boundHintText(bound, b) {
        if (b.mode === 'none') return '';
        const value = b.value ?? 0;
        if (b.mode === 'day') {
            if (value === 0) return 'Today';
            return `${value} day${value === 1 ? '' : 's'} ${bound === 'upper' ? 'ahead' : 'ago'}`;
        }
        if (value === 0) return 'This month';
        return `${value} month${value === 1 ? '' : 's'} ago`;
    }

    // Plain-language summary shown to the right of the preview pill —
    // reuses the same per-bound phrasing as boundHintText, collapsed to one
    // word when both bounds land on the same phrase (e.g. Day 0 / Day 0 →
    // just "Today" instead of "Today → Today").
    function deadlineSummaryText(dd) {
        const lo = boundHintText('lower', dd.lower);
        const hi = boundHintText('upper', dd.upper);
        if (!lo && !hi) return 'No limit';
        if (lo === hi) return lo;
        return `${lo || 'No limit'} → ${hi || 'No limit'}`;
    }

    // Mirrors the resolve logic b-quest-list.html itself will use to apply
    // this default at page load — kept in sync deliberately so the preview
    // shown here is never misleading about what viewers will actually see.
    function computeDeadlinePreview(dd) {
        const today = new Date();
        const fmt = d => `${d.getDate()}/${d.getMonth() + 1}/${d.getFullYear()}`;
        function resolve(bound, isUpper) {
            if (bound.mode === 'none') return null;
            if (bound.mode === 'day') {
                const d = new Date(today);
                d.setDate(d.getDate() + (isUpper ? bound.value : -bound.value));
                return d;
            }
            return isUpper
                ? new Date(today.getFullYear(), today.getMonth() - bound.value + 1, 0)  // last day of that month
                : new Date(today.getFullYear(), today.getMonth() - bound.value, 1);      // first day of that month
        }
        const lo = resolve(dd.lower, false);
        const hi = resolve(dd.upper, true);
        return { lo: lo ? fmt(lo) : 'No limit', hi: hi ? fmt(hi) : 'No limit' };
    }

    function configBuffer() {
        return { ...originalConfig, ...configChanges };
    }

    function onConfigField(rule, value) {
        configChanges[rule] = value;
        markDirty('section-worklist');
        renderWorkConfigToggles();
        renderWork();
    }

    function renderWorkConfigToggles() {
        const el = document.getElementById('workConfigToggles');
        if (!el) return;
        const cfg = configBuffer();
        const item = (rule, label) => `
            <label class="wcfg-item">
                <span>${label}</span>
                <label class="bq-toggle small">
                    <input type="checkbox" ${cfg[rule] !== false ? 'checked' : ''} onchange="onConfigField('${rule}', this.checked)">
                    <span class="bq-slider"></span>
                </label>
            </label>`;
        el.innerHTML = item('work_day_enabled', 'Day') + item('work_max_enabled', 'Max');
    }

    // ═══════════════════════════════════════════
    // Work Calendar — how much of a day's capacity actually counts, per
    // weekday (0-100%). Feeds the same b-quest-setting table as the Day/Max
    // toggles above but through its own staging bucket (calendarChanges),
    // so this box's dirty-dot and the Work List box's don't get confused
    // with each other's pending state.
    // ═══════════════════════════════════════════
    const WEEK_DAYS = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
    const WORKDAY_DEFAULT = { mon: 100, tue: 100, wed: 100, thu: 100, fri: 100, sat: 100, sun: 100 };

    function calendarConfigBuffer() {
        return { ...originalConfig, ...calendarChanges };
    }

    function renderWorkCalendar() {
        const cfg = calendarConfigBuffer();
        const weights = { ...WORKDAY_DEFAULT, ...(cfg.workday_weight || {}) };
        // "Include Holidays" is the inverse of the stored merge_company_
        // holidays flag — merge=true is what actually SKIPS holidays (0%/
        // 50% override instead of their weekday %), so checked (Include)
        // means merge is false.
        const mergeEl = document.getElementById('wc-merge-toggle-input');
        if (mergeEl) mergeEl.checked = cfg.merge_company_holidays !== true;
        const list = document.getElementById('wc-day-list');
        if (!list) return;
        list.innerHTML = WEEK_DAYS.map(day => {
            const v = weights[day] ?? 100;
            return `
            <div class="wc-day-row ${v < 100 ? 'low' : ''} ${v === 0 ? 'zero' : ''}" data-day="${day}">
                <span class="wc-day-label">${day.toUpperCase()}</span>
                <input type="range" class="wc-slider" min="0" max="100" value="${v}" oninput="onWorkdayPctInput('${day}', this.value)">
                <div class="wc-pct-wrap">
                    <input type="number" class="wc-pct-input" min="0" max="100" value="${v}" oninput="onWorkdayPctInput('${day}', this.value)">
                    <span class="wc-pct-sign">%</span>
                </div>
            </div>`;
        }).join('');
    }

    // Direct DOM sync instead of a full renderWorkCalendar() — dragging the
    // slider fires this continuously, and replacing the row's DOM mid-drag
    // would drop the drag gesture (same reason name-input fields skip
    // re-rendering on every keystroke elsewhere on this page).
    function onWorkdayPctInput(day, rawValue) {
        const v = Math.max(0, Math.min(100, Math.round(Number(rawValue)) || 0));
        const cfg = calendarConfigBuffer();
        calendarChanges.workday_weight = { ...WORKDAY_DEFAULT, ...(cfg.workday_weight || {}), [day]: v };
        markDirty('section-calendar');
        const row = document.querySelector(`.wc-day-row[data-day="${day}"]`);
        if (row) {
            row.querySelector('.wc-slider').value = v;
            row.querySelector('.wc-pct-input').value = v;
            row.classList.toggle('low', v < 100);
            row.classList.toggle('zero', v === 0);
        }
    }

    // Inert until the company holiday list itself exists — staged and
    // saved like everything else here so it's already wired up and ready
    // the moment that feature lands, instead of needing this UI built then.
    function onMergeHolidaysToggle(checked) {
        // checked = Include Holidays on = holidays counted normally =
        // merge_company_holidays false (see renderWorkCalendar).
        calendarChanges.merge_company_holidays = !checked;
        markDirty('section-calendar');
    }

    // ═══════════════════════════════════════════
    // Notifications & Email — settings only (which recipients a rule
    // resolves to). Turning those rules into an actual deduped send list
    // (matching codenames to real emails, collapsing the same person
    // reached via two different rules, etc.) is separate work for once
    // this is wired to real trigger events — not built here.
    // ═══════════════════════════════════════════
    const NOTIFY_ACTIONS = ['new', 'edit', 'delete', 'assign'];
    const NOTIFY_RULE_DEFAULT = { owner: false, leads: false, assignee: false, departments: [], codenames: [], exclude_codenames: [] };

    function notifyConfigBuffer() {
        return { ...originalConfig, ...notifyChanges };
    }

    function notifyRuleKey(action, channel) {
        return `${channel}_${action}`; // e.g. 'notify_new', 'email_delete'
    }

    function notifyRule(action, channel) {
        const raw = notifyConfigBuffer()[notifyRuleKey(action, channel)] || {};
        return {
            ...NOTIFY_RULE_DEFAULT, ...raw,
            departments: raw.departments || [],
            codenames: raw.codenames || [],
            exclude_codenames: raw.exclude_codenames || []
        };
    }

    function setNotifyRule(action, channel, rule) {
        notifyChanges[notifyRuleKey(action, channel)] = rule;
        markDirty('section-notify');
    }

    // ═══════════════════════════════════════════
    // Merge Duplicate Names — Account Name / Opportunity Name are plain
    // free-text fields on b-quest-modal.js (search button there just
    // suggests past values, doesn't restrict input — see openSearchOverlay).
    // Typos and spacing variants pile up over time ("SCBX"/"SCB X"/
    // "SCB_X"); this lists every distinct value actually in use on
    // b_quest_list and lets an admin merge the ones that are really the
    // same thing into one chosen spelling. Immediate action (its own
    // confirm dialog), not staged into the page's Save Bar — same
    // "irreversible action gets its own confirm" convention as Delete
    // elsewhere in this app, not an edit to undo/redo.
    // ═══════════════════════════════════════════
    let cleanupData = { account_name: [], opportunity_name: [] }; // [{value, count}] per field, loaded from b_quest_list
    let cleanupTab = 'account_name';
    let cleanupSelected = { account_name: new Set(), opportunity_name: new Set() };
    let cleanupSearchQ = { account_name: '', opportunity_name: '' };
    // 'count' desc by default (biggest duplicates first, the common
    // triage order) — clicking Name/Tasks in the column head re-sorts.
    let cleanupSort = { account_name: { key: 'count', dir: 'desc' }, opportunity_name: { key: 'count', dir: 'desc' } };

    async function loadNameCleanup() {
        const { data } = await supabaseClient.from('b_quest_list').select('account_name, opportunity_name');
        const countBy = (field) => {
            // Group by the RAW value, not trim()'d — a value that only
            // differs by hidden leading/trailing whitespace (e.g. "Foo "
            // vs "Foo") is a real, separate duplicate in the DB that the
            // old trim()'d grouping hid as one row, which also broke
            // Merge: it matches on exact value, so it silently skipped
            // whichever whitespace variant wasn't the literal selected
            // string. Showing every raw variant as its own row means
            // selecting it also merges it for real.
            const m = new Map();
            (data || []).forEach(r => {
                const v = r[field] || '';
                if (!v.trim()) return;
                m.set(v, (m.get(v) || 0) + 1);
            });
            return [...m.entries()]
                .map(([value, count]) => ({ value, count }))
                .sort((a, b) => b.count - a.count || a.value.localeCompare(b.value, 'th'));
        };
        cleanupData.account_name = countBy('account_name');
        cleanupData.opportunity_name = countBy('opportunity_name');
        renderCleanupList();
    }

    function switchCleanupTab(field) {
        cleanupTab = field;
        document.getElementById('cleanup-tabs').querySelectorAll('.np-tab').forEach(b => b.classList.toggle('active', b.dataset.field === field));
        document.getElementById('cleanup-search').value = cleanupSearchQ[field];
        const input = document.getElementById('cleanup-merge-input');
        input.value = '';
        input.dataset.touched = '';
        renderCleanupList();
    }

    function onCleanupSearch(val) {
        cleanupSearchQ[cleanupTab] = val;
        renderCleanupList();
    }

    function setCleanupSort(key) {
        const s = cleanupSort[cleanupTab];
        if (s.key === key) {
            s.dir = s.dir === 'asc' ? 'desc' : 'asc';
        } else {
            s.key = key;
            s.dir = key === 'value' ? 'asc' : 'desc'; // name defaults A→Z, count defaults biggest-first
        }
        renderCleanupList();
    }

    function updateCleanupSortIcons() {
        const sort = cleanupSort[cleanupTab];
        ['value', 'count'].forEach(key => {
            const el = document.getElementById(`cleanup-sort-${key}`);
            if (!el) return;
            el.innerHTML = sort.key !== key
                ? '<i class="bi bi-chevron-expand cleanup-sort-icon"></i>'
                : (sort.dir === 'asc' ? '<i class="bi bi-chevron-up cleanup-sort-icon active"></i>' : '<i class="bi bi-chevron-down cleanup-sort-icon active"></i>');
        });
    }

    function renderCleanupList() {
        const field = cleanupTab;
        const q = cleanupSearchQ[field].trim().toLowerCase();
        const sort = cleanupSort[field];
        const rows = cleanupData[field]
            .filter(r => !q || r.value.toLowerCase().includes(q))
            .slice()
            .sort((a, b) => {
                const cmp = sort.key === 'value' ? a.value.localeCompare(b.value, 'th') : a.count - b.count;
                return sort.dir === 'asc' ? cmp : -cmp;
            });
        updateCleanupSortIcons();
        const list = document.getElementById('cleanup-list');
        list.innerHTML = rows.length ? rows.map(r => {
            const checked = cleanupSelected[field].has(r.value);
            return `
            <label class="cleanup-row ${checked ? 'checked' : ''}">
                <input type="checkbox" class="modern-checkbox" data-value="${esc(r.value)}" ${checked ? 'checked' : ''} onchange="toggleCleanupValue(this.dataset.value, this.checked)">
                <span class="cleanup-row-name">${formatCleanupName(r.value)}</span>
                <span class="cleanup-row-count">${r.count} task${r.count === 1 ? '' : 's'}</span>
            </label>`;
        }).join('') : `<div class="cleanup-empty">${q ? 'No matches' : 'No data yet'}</div>`;
        renderCleanupMergeBar();
    }

    // Leading/trailing whitespace is otherwise invisible — without this,
    // two rows that differ only by a hidden trailing space look like an
    // exact duplicate with no visible reason there are two of them.
    function formatCleanupName(value) {
        return esc(value)
            .replace(/^( +)/, m => `<span class="cleanup-ws-mark">${'␣'.repeat(m.length)}</span>`)
            .replace(/( +)$/, m => `<span class="cleanup-ws-mark">${'␣'.repeat(m.length)}</span>`);
    }

    function toggleCleanupValue(value, checked) {
        checked ? cleanupSelected[cleanupTab].add(value) : cleanupSelected[cleanupTab].delete(value);
        renderCleanupList();
    }

    // Also serves as Rename when exactly 1 item is selected — same bar,
    // same flow, just a single-value update instead of a multi-value one
    // (e.g. fixing a typo in one name doesn't need a second duplicate to
    // exist first).
    function renderCleanupMergeBar() {
        const field = cleanupTab;
        const selected = [...cleanupSelected[field]];
        const bar = document.getElementById('cleanup-merge-bar');
        if (selected.length < 1) { bar.style.display = 'none'; return; }
        bar.style.display = 'flex';
        document.getElementById('cleanup-merge-count').textContent = selected.length === 1 ? 'Rename' : `${selected.length} selected`;
        const input = document.getElementById('cleanup-merge-input');
        // Default to the most-used selected value — usually the "correct"
        // spelling (or, with 1 selected, just that value itself, ready to
        // edit) — but only when the box is still untouched/empty so a
        // reselect doesn't clobber something the admin already typed.
        if (!input.dataset.touched) {
            const sorted = selected.map(v => cleanupData[field].find(r => r.value === v)).filter(Boolean).sort((a, b) => b.count - a.count);
            input.value = sorted[0]?.value || '';
        }
    }

    async function mergeCleanup() {
        const field = cleanupTab;
        const selected = [...cleanupSelected[field]];
        if (selected.length < 1) return;
        const target = document.getElementById('cleanup-merge-input').value.trim();
        if (!target) return Swal.fire('Wait!', 'Type the name to merge into.', 'warning');

        const totalCount = selected.reduce((s, v) => s + (cleanupData[field].find(r => r.value === v)?.count || 0), 0);
        const fieldLabel = field === 'account_name' ? 'Account Name' : 'Opportunity Name';
        const html = selected.length === 1
            ? `This will rename <b>1</b> ${esc(fieldLabel)} value to "<b>${esc(target)}</b>" across <b>${totalCount}</b> task(s). This can't be undone.`
            : `This will rename <b>${selected.length}</b> different ${esc(fieldLabel)} values into "<b>${esc(target)}</b>" across <b>${totalCount}</b> task(s). This can't be undone.`;
        const result = await Swal.fire({
            title: selected.length === 1 ? 'Rename this name?' : 'Merge these names?',
            html,
            icon: 'warning',
            showCancelButton: true,
            confirmButtonText: selected.length === 1 ? 'Rename' : 'Merge',
            confirmButtonColor: '#dc3545'
        });
        if (!result.isConfirmed) return;

        const { error } = await supabaseClient.from('b_quest_list').update({ [field]: target }).in(field, selected);
        if (error) { Swal.fire('Error', error.message, 'error'); return; }

        Swal.fire({ icon: 'success', title: selected.length === 1 ? 'Renamed!' : 'Merged!', showConfirmButton: false, timer: 1200 });
        cleanupSelected[field].clear();
        document.getElementById('cleanup-merge-input').dataset.touched = '';
        await loadNameCleanup();
    }

    // Always-clickable, no selection needed — scans every name in the
    // current tab for a hidden leading/trailing space (see
    // formatCleanupName()'s ␣ marker) and fixes all of them at once. If
    // trimming makes a value collide with an existing clean entry, this
    // IS the merge for that pair — same single update, no extra step.
    async function trimAllWhitespace() {
        const field = cleanupTab;
        const changes = cleanupData[field]
            .filter(r => r.value !== r.value.trim())
            .map(r => ({ from: r.value, to: r.value.trim(), count: r.count }));
        if (!changes.length) return Swal.fire({ icon: 'info', title: 'Nothing to trim', text: 'No names with extra leading/trailing space found.', timer: 1800, showConfirmButton: false });

        const totalCount = changes.reduce((s, c) => s + c.count, 0);
        const fieldLabel = field === 'account_name' ? 'Account Name' : 'Opportunity Name';
        const result = await Swal.fire({
            title: 'Trim whitespace?',
            html: `This will strip leading/trailing spaces from <b>${changes.length}</b> ${esc(fieldLabel)} value(s) across <b>${totalCount}</b> task(s). Any that match an existing name after trimming will merge into it.`,
            icon: 'warning',
            showCancelButton: true,
            confirmButtonText: 'Trim',
            confirmButtonColor: '#dc3545'
        });
        if (!result.isConfirmed) return;

        for (const c of changes) {
            const { error } = await supabaseClient.from('b_quest_list').update({ [field]: c.to }).eq(field, c.from);
            if (error) { Swal.fire('Error', error.message, 'error'); return; }
        }

        Swal.fire({ icon: 'success', title: 'Trimmed!', showConfirmButton: false, timer: 1200 });
        await loadNameCleanup();
    }

    function npBadge(text, removeCall) {
        return `<span class="np-badge">${esc(text)}<button type="button" onclick="${removeCall}" title="Remove"><i class="bi bi-x"></i></button></span>`;
    }

    function renderNotifySection() {
        ['notify', 'email'].forEach(channel => {
            const list = document.getElementById(`notify-rows-${channel}`);
            if (!list) return;
            list.innerHTML = NOTIFY_ACTIONS.map(action => renderNotifyRow(action, channel)).join('');
        });
    }

    function renderNotifyRow(action, channel) {
        const rule = notifyRule(action, channel);
        let badges = '';
        if (rule.owner) badges += npBadge('Owner', `toggleNotifyFlag('${action}','${channel}','owner',false)`);
        if (rule.leads) badges += npBadge('Leads', `toggleNotifyFlag('${action}','${channel}','leads',false)`);
        if (rule.assignee) badges += npBadge('Assignee', `toggleNotifyFlag('${action}','${channel}','assignee',false)`);
        rule.departments.forEach(d => badges += npBadge(d, `toggleNotifyDept('${action}','${channel}','${esc(d)}',false)`));
        rule.codenames.forEach(c => badges += npBadge(c, `toggleNotifyCodename('${action}','${channel}','${esc(c)}',false,false)`));
        let exBadges = '';
        rule.exclude_codenames.forEach(c => exBadges += npBadge(c, `toggleNotifyCodename('${action}','${channel}','${esc(c)}',false,true)`));
        return `
        <div class="np-row">
            <div class="np-row-head">${action.toUpperCase()}</div>
            <div class="np-badges">${badges}<button type="button" class="cfg-btn-add hover-scale" onclick="openNotifyRecipientPicker(event,'${action}','${channel}')"><i class="bi bi-plus-lg"></i> Add</button></div>
            <div class="np-without-row">
                <span class="np-without-label">Without</span>
                ${exBadges}
                <button type="button" class="np-without-add" onclick="openNotifyExcludePicker(event,'${action}','${channel}')"><i class="bi bi-plus"></i> Add</button>
            </div>
        </div>`;
    }

    function toggleNotifyFlag(action, channel, flag, checked) {
        const rule = notifyRule(action, channel);
        setNotifyRule(action, channel, { ...rule, [flag]: checked });
        renderNotifySection();
    }

    function toggleNotifyDept(action, channel, dept, checked) {
        const rule = notifyRule(action, channel);
        const departments = new Set(rule.departments);
        checked ? departments.add(dept) : departments.delete(dept);
        setNotifyRule(action, channel, { ...rule, departments: [...departments] });
        renderNotifySection();
    }

    function toggleNotifyCodename(action, channel, codename, checked, isExclude) {
        const rule = notifyRule(action, channel);
        const field = isExclude ? 'exclude_codenames' : 'codenames';
        const set = new Set(rule[field]);
        checked ? set.add(codename) : set.delete(codename);
        setNotifyRule(action, channel, { ...rule, [field]: [...set] });
        renderNotifySection();
    }

    // "Add recipient" — Owner/Leads/Assignee as quick checkboxes (fixed,
    // no search needed) plus Department and Codename as searchable lists.
    // Tabbed (not stacked) so the popup stays a fixed, scannable height
    // regardless of how many departments/people exist — a dot on a tab's
    // own label shows it has a selection without having to switch to it.
    function openNotifyRecipientPicker(evt, action, channel) {
        pickerTarget = { kind: 'notify-add', action, channel };
        const rule = notifyRule(action, channel);
        const panel = document.getElementById('picker-panel');
        panel.classList.remove('medium');
        panel.classList.add('wide');

        const quickOn = rule.owner || rule.leads || rule.assignee;
        const deptOn = rule.departments.length > 0;
        const codenameOn = rule.codenames.length > 0;
        const dot = on => on ? '<span class="np-tab-dot"></span>' : '';

        panel.innerHTML = `
            <div class="np-picker-tabs">
                <button class="np-picker-tab-btn active" data-np-tab="quick" onclick="switchNotifyPickerTab(this)">Quick${dot(quickOn)}</button>
                ${originalDepartments.length ? `<button class="np-picker-tab-btn" data-np-tab="department" onclick="switchNotifyPickerTab(this)">Department${dot(deptOn)}</button>` : ''}
                <button class="np-picker-tab-btn" data-np-tab="codename" onclick="switchNotifyPickerTab(this)">Codename${dot(codenameOn)}</button>
            </div>
            <div class="np-tab-panel" data-tab="quick">
                <div class="np-quick-row">
                    <label class="np-quick-chip"><input type="checkbox" class="modern-checkbox" ${rule.owner ? 'checked' : ''} onchange="toggleNotifyFlag('${action}','${channel}','owner',this.checked)"> Owner</label>
                    <label class="np-quick-chip"><input type="checkbox" class="modern-checkbox" ${rule.leads ? 'checked' : ''} onchange="toggleNotifyFlag('${action}','${channel}','leads',this.checked)"> Leads</label>
                    <label class="np-quick-chip"><input type="checkbox" class="modern-checkbox" ${rule.assignee ? 'checked' : ''} onchange="toggleNotifyFlag('${action}','${channel}','assignee',this.checked)"> Assignee</label>
                </div>
            </div>
            ${originalDepartments.length ? `
            <div class="np-tab-panel" data-tab="department" style="display:none">
                <div class="np-scroll-list">
                    ${originalDepartments.map(d => `<label class="np-list-item"><input type="checkbox" class="modern-checkbox" ${rule.departments.includes(d) ? 'checked' : ''} onchange="toggleNotifyDept('${action}','${channel}','${esc(d)}',this.checked)"> ${esc(d)}</label>`).join('')}
                </div>
            </div>` : ''}
            <div class="np-tab-panel" data-tab="codename" style="display:none">
                <div class="cfg-search-wrap"><i class="bi bi-search cfg-search-icon"></i><input type="text" class="cfg-icon-search" id="np-codename-search" placeholder="Search..." oninput="renderNotifyCodenameList(this.value)"></div>
                <div class="np-scroll-list" id="np-codename-list"></div>
            </div>
        `;
        renderNotifyCodenameList('');
        positionPicker(evt);
    }

    function switchNotifyPickerTab(btn) {
        const tab = btn.dataset.npTab;
        btn.parentElement.querySelectorAll('.np-picker-tab-btn').forEach(b => b.classList.toggle('active', b === btn));
        btn.closest('#picker-panel').querySelectorAll('.np-tab-panel').forEach(p => {
            p.style.display = p.dataset.tab === tab ? '' : 'none';
        });
    }

    // "Without" — codename only (excluding by whole department/role isn't
    // the use case; it's always "this one specific person, regardless of
    // which broad rule would otherwise catch them").
    function openNotifyExcludePicker(evt, action, channel) {
        pickerTarget = { kind: 'notify-exclude', action, channel };
        const panel = document.getElementById('picker-panel');
        panel.classList.remove('wide');
        panel.classList.add('medium');
        panel.innerHTML = `
            <div class="cfg-picker-label">Exclude Codename</div>
            <div class="cfg-search-wrap"><i class="bi bi-search cfg-search-icon"></i><input type="text" class="cfg-icon-search" id="np-codename-search" placeholder="Search..." oninput="renderNotifyCodenameList(this.value)"></div>
            <div class="np-scroll-list" id="np-codename-list"></div>
        `;
        renderNotifyCodenameList('');
        positionPicker(evt);
    }

    function renderNotifyCodenameList(q) {
        const { action, channel, kind } = pickerTarget || {};
        if (!action) return;
        const isExclude = kind === 'notify-exclude';
        const rule = notifyRule(action, channel);
        const selected = new Set(isExclude ? rule.exclude_codenames : rule.codenames);
        const ql = q.trim().toLowerCase();
        const list = allProfiles.filter(p => !ql || p.codename.toLowerCase().includes(ql));
        const el = document.getElementById('np-codename-list');
        if (!el) return;
        el.innerHTML = list.length ? list.map(p => `
            <label class="np-list-item"><input type="checkbox" class="modern-checkbox" ${selected.has(p.codename) ? 'checked' : ''} onchange="toggleNotifyCodename('${action}','${channel}','${esc(p.codename)}',this.checked,${isExclude})"> ${esc(p.codename)}</label>
        `).join('') : '<div class="cfg-empty">No matches</div>';
    }

    function workBuffer() {
        return originalWork.map(w => ({ ...w, ...(workChanges[w.id] || {}), _deleted: workDeletes.has(w.id) }))
            .concat(Object.entries(workChanges).filter(([id]) => id.startsWith('new-')).map(([id, c]) => ({ id, ...c, _new: true })));
    }

    let workDeletes = new Set();

    let workTabRole = null; // Work List tab shown on phones
    function setWorkTab(roleId) { workTabRole = roleId; renderWork(); }

    function renderWork() {
        const container = document.getElementById('work-cols');
        const roles = roleBuffer().filter(r => r.active !== false && !r._deleted);
        const cfg = configBuffer();
        const dayOn = cfg.work_day_enabled !== false;
        const maxOn = cfg.work_max_enabled !== false;
        container.classList.remove('count-1', 'count-2', 'cfg-no-day', 'cfg-no-max');
        if (roles.length === 1) container.classList.add('count-1');
        else if (roles.length === 2) container.classList.add('count-2');
        if (!dayOn) container.classList.add('cfg-no-day');
        if (!maxOn) container.classList.add('cfg-no-max');
        if (!roles.length) {
            container.innerHTML = '<div class="work-empty">Add a role above first.</div>';
            document.getElementById('work-role-tabs').innerHTML = '';
            return;
        }
        // Phone shows one role column at a time (CSS); keep the picked
        // tab across re-renders, falling back to the first role.
        if (!roles.some(r => r.id === workTabRole)) workTabRole = roles[0].id;
        document.getElementById('work-role-tabs').innerHTML = roles.map(r => {
            const on = r.id === workTabRole;
            return `<button type="button" class="work-role-tab ${on ? 'active' : ''}" style="${on ? `background:${r.color}22;border-color:${r.color};color:${r.color}` : ''}" onclick="setWorkTab('${r.id}')"><i class="bi ${r.icon || 'bi-person-workspace'}"></i> ${esc(r.name) || 'Untitled'}</button>`;
        }).join('');

        const buf = workBuffer();

        container.innerHTML = roles.map(r => {
            const items = buf.filter(w => w.role_id === r.id).sort((a, b) => (a.sort_order ?? 999) - (b.sort_order ?? 999));
            return `
            <div class="work-col ${r.id === workTabRole ? 'is-tab-active' : ''}">
                <div class="work-col-header" style="background:${r.color}22; border-color:${r.color}55;">
                    <div class="work-col-title-group">
                        <div class="work-col-title" style="color:${r.color}"><i class="bi ${r.icon || 'bi-person-workspace'}"></i> ${esc(r.name) || 'Untitled'}</div>
                        <span class="work-col-count">${items.filter(w => !w._deleted).length}</span>
                    </div>
                    <div style="display:flex; align-items:center; gap:6px;">
                        <button class="work-col-sort" onclick="sortWorkAlpha('${r.id}')" title="Sort A-Z"><i class="bi bi-sort-alpha-down"></i></button>
                        <button class="btn-add-work hover-scale" style="background:${r.color}" onclick="addWork('${r.id}')"><i class="bi bi-plus-lg"></i> Add</button>
                    </div>
                </div>
                <div class="work-col-inner">
                    <div class="work-col-subhead">
                        <span></span><span>Work Name</span><span style="text-align:center;">Weight</span>${dayOn ? '<span style="text-align:center;">Day</span>' : ''}${maxOn ? '<span style="text-align:center;" class="work-col-divider">Max</span>' : ''}<span></span>
                    </div>
                    ${items.length ? items.map((w, i) => `
                        <div class="work-row ${w._new ? 'is-new' : ''} ${w._deleted ? 'is-deleted' : ''}" data-id="${w.id}"
                             draggable="${!w._deleted}"
                             ondragstart="dragStart(event, 'work', '${w.id}', '${r.id}')" ondragend="dragEnd(event)"
                             ondragover="event.preventDefault()" ondragenter="dragEnterRow(event, 'work', '${w.id}', '${r.id}')" ondragleave="dragLeaveRow(event)"
                             ondrop="dropOnRow(event, 'work', '${w.id}', '${r.id}')">
                            <div class="work-drag-handle"><i class="bi bi-grip-vertical"></i>${moveBtns('work', w.id, r.id)}</div>
                            <input class="work-input" value="${esc(w.work)}" oninput="onWorkField('${w.id}', 'work', this.value)">
                            <input class="work-weight" type="number" step="0.01" value="${w.weight ?? ''}" oninput="onWorkField('${w.id}', 'weight', this.value === '' ? null : parseFloat(this.value))">
                            ${dayOn ? `<input class="work-weight" type="text" value="${esc(w.day ?? 1)}" oninput="onWorkField('${w.id}', 'day', this.value)">` : ''}
                            ${maxOn ? `<input class="work-weight work-col-divider" type="text" inputmode="decimal" value="${w.max_per_day == null ? '-' : w.max_per_day}" oninput="onWorkField('${w.id}', 'max_per_day', parseMaxPerDay(this.value))">` : ''}
                            ${w._deleted
                                ? `<button class="cfg-btn-undo" onclick="undoRemoveWork('${w.id}')" title="Undo delete"><i class="bi bi-arrow-counterclockwise"></i></button>`
                                : `<button class="btn-work-del" onclick="removeWork('${w.id}')" title="Delete"><i class="bi bi-trash3"></i></button>`}
                        </div>
                    `).join('') : '<div class="work-empty">No items yet</div>'}
                </div>
            </div>`;
        }).join('');
    }

    function onWorkField(id, field, value) {
        if (!workChanges[id]) workChanges[id] = {};
        workChanges[id][field] = value;
        markDirty('section-worklist');
    }

    // "-" (or blank) means unlimited (stored as null); anything else parses
    // as the per-day cap. Typos/non-numeric text also fall back to null
    // rather than throwing, since this field has no strict format.
    function parseMaxPerDay(raw) {
        const v = (raw ?? '').toString().trim();
        if (v === '' || v === '-' || v === '−') return null;
        const n = parseFloat(v);
        return isNaN(n) ? null : n;
    }

    function addWork(roleId) {
        const id = `new-${roleIdSeq--}`;
        const items = workBuffer().filter(w => w.role_id === roleId && !w._deleted);
        const maxOrder = Math.max(0, ...items.map(w => w.sort_order || 0));
        workChanges[id] = { role_id: roleId, work: '', day: '1', weight: 1, max_per_day: null, sort_order: maxOrder + 1 };
        markDirty('section-worklist');
        renderWork();
        focusNewRow(id, '.work-input');
    }

    function removeWork(id) {
        if (id.startsWith('new-')) { delete workChanges[id]; }
        else { workDeletes.add(id); }
        markDirty('section-worklist');
        renderWork();
    }

    function undoRemoveWork(id) {
        workDeletes.delete(id);
        markDirty('section-worklist');
        renderWork();
    }

    // Same "reset to alphabetical" as sortAlpha(), but scoped to one role's
    // work column (work items are grouped by role, not a flat list).
    function sortWorkAlpha(roleId) {
        const list = workBuffer().filter(w => w.role_id === roleId && !w._deleted)
            .sort((a, b) => (a.work || '').localeCompare(b.work || '', undefined, { sensitivity: 'base' }));
        list.forEach((item, i) => { (workChanges[item.id] ||= {}).sort_order = i + 1; });
        markDirty('section-worklist');
        renderWork();
    }

    // ═══════════════════════════════════════════
    // Save All (Roles / Statuses / Work List)
    // ═══════════════════════════════════════════
    // Insert new / update existing / delete removed rows for one table.
    // Skips the UPDATE call entirely for rows also marked for deletion —
    // they're about to be deleted anyway, no point writing to them first.
    // Returns a temp-id -> real-id map for whatever got inserted, so a
    // caller that staged something referencing a 'new-N' id (e.g. Status's
    // default_status_id) can swap in the row's actual id afterward.
    async function saveTable(table, changes, deletes, requiredField, errors, label) {
        const idMap = {};
        for (const [id, ch] of Object.entries(changes)) {
            if (deletes.has(id)) continue;
            if (id.startsWith('new-')) {
                if (!ch[requiredField]?.trim()) continue;
                const { data, error } = await supabaseClient.from(table).insert([{ ...ch, [requiredField]: ch[requiredField].trim() }]).select().single();
                if (error) errors.push(`${label} add "${ch[requiredField]}": ` + error.message);
                else if (data) idMap[id] = data.id;
            } else {
                const { error } = await supabaseClient.from(table).update(ch).eq('id', id);
                if (error) errors.push(`${label} update: ` + error.message);
            }
        }
        for (const id of deletes) {
            const { error } = await supabaseClient.from(table).delete().eq('id', id);
            if (error) {
                // 23503 = foreign key violation — this row (Role/Status) is
                // still referenced by existing tasks. The raw Postgres
                // message is unreadable to a non-technical user; the delete
                // is safely blocked either way (nothing is lost), so just
                // explain the actual reason and the way out.
                errors.push(error.code === '23503'
                    ? `Cannot Delete: ${label} is used by existing tasks. Deactivate it instead.`
                    : `${label} delete: ` + error.message);
            }
        }
        return idMap;
    }

    async function saveAll() {
        try {
            if (!(await validateLinksBeforeSave())) return;
            const errors = [];
            const roleIdMap = await saveTable('b_quest_role', roleChanges, roleDeletes, 'name', errors, 'Role');
            // A brand-new Role's Work items / Member grants staged in this
            // SAME save still reference its temp 'new-N' id — swap in the
            // real one now that saveTable above actually inserted it,
            // otherwise their own insert fails (invalid uuid). Also drop
            // those temp ids from roleChanges itself: they're now safely
            // represented by the real reloaded row, so leaving them staged
            // would show the role twice if some LATER step in this same
            // save fails (the error path reloads from DB but never clears
            // already-succeeded entries out of the change buffers).
            Object.values(workChanges).forEach(ch => { if (ch.role_id?.startsWith?.('new-')) ch.role_id = roleIdMap[ch.role_id] || ch.role_id; });
            Object.keys(roleIdMap).forEach(tempId => delete roleChanges[tempId]);

            const statusIdMap = await saveTable('b_quest_status', statusChanges, statusDeletes, 'name', errors, 'Status');
            await saveTable('b_quest_type', typeChanges, typeDeletes, 'name', errors, 'Type');
            await saveTable('b_quest_work', workChanges, workDeletes, 'work', errors, 'Work');

            // Force exactly one Default — if the configured one is no
            // longer valid (deleted/deactivated this session) or was never
            // set, persist the resolved fallback so the DB itself always
            // has an explicit value, not just the UI's live display guess.
            // The resolved id can be a still-unsaved 'new-N' row (e.g. the
            // very first Status ever added) — swap in its real id, now that
            // saveTable above has actually inserted it.
            let resolvedStatusDefault = resolveDefaultStatusId(statusBuffer());
            if (resolvedStatusDefault && resolvedStatusDefault.startsWith('new-')) {
                resolvedStatusDefault = statusIdMap[resolvedStatusDefault] || null;
            }
            if (resolvedStatusDefault && resolvedStatusDefault !== statusConfigBuffer().default_status_id) {
                statusConfigChanges.default_status_id = resolvedStatusDefault;
            }

            for (const [rule, value] of Object.entries({ ...configChanges, ...statusConfigChanges, ...calendarChanges, ...visibilityChanges, ...linkChanges, ...filterDefaultsChanges, ...notifyChanges })) {
                const { error } = await supabaseClient.from('b_quest_setting').upsert({ rule, value });
                if (error) errors.push('Settings update: ' + error.message);
            }

            if (errors.length) {
                // Something failed partway through — keep everything staged
                // (including whatever DID succeed, since re-saving those
                // rows again is harmless) so the user can fix and retry
                // instead of silently losing unsaved work.
                const allCannotDelete = errors.every(e => e.startsWith('Cannot Delete:'));
                const title = allCannotDelete ? 'Cannot Delete' : 'Some errors occurred';
                const body = allCannotDelete ? errors.map(e => e.replace('Cannot Delete: ', '')).join('\n') : errors.join('\n');
                Swal.fire(title, body, 'error');
                await Promise.all([loadRoles(), loadStatuses(), loadTypes(), loadConfig()]);
                renderFilterDefaultsSection();
                await loadWork();
                return;
            }

            Swal.fire({ icon: 'success', title: 'Saved!', showConfirmButton: false, timer: 1200 });
            clearDirty();
            await Promise.all([loadRoles(), loadStatuses(), loadTypes(), loadConfig()]);
            renderFilterDefaultsSection();
            await loadWork(); // roles feed this

        } catch (e) {
            Swal.fire('Error', e.message, 'error');
        }
    }

    async function loadAllProfiles() {
        const { data } = await supabaseClient.from('profiles').select('codename, nick_name, full_name, employee_id, department, level').neq('level', 'god').order('codename');
        allProfiles = data || [];
    }

    function profileFor(codename) {
        return allProfiles.find(p => p.codename === codename);
    }

    // This page has no <form> anywhere, so pressing Enter in a text/number
    // field normally does nothing — focus just stays stuck. Enter should
    // confirm the value and exit the field instead (there's nothing to
    // "submit" since every field already saves on blur/oninput into the
    // staged buffer).
    document.addEventListener('keydown', e => {
        if (e.key !== 'Enter') return;
        const el = e.target;
        if (el.tagName !== 'INPUT' || el.type === 'checkbox' || el.type === 'radio') return;
        e.preventDefault();
        el.blur();
    });

    loadPage();
</script>
</body>
</html>
