    }

    // ── State ──
    let originalRoles = [];
    let originalStatuses = [];
    let originalTypes = [];
    let originalWork = [];
    let originalConfig = {}; // rule -> value, as loaded from DB
    let roleChanges = {};
    let statusChanges = {};
    let typeChanges = {};
    let workChanges = {};
    let configChanges = {}; // rule -> staged value (not row-keyed like the others — this is a flat key/value bucket, not a list)
    const configDeletes = new Set(); // never populated — config rules aren't deletable from this UI, kept only so eachSection's (id, changes, deletes) shape stays uniform
    // Own staging bucket (not configChanges) so Work Calendar gets its own
    // dirty-dot/section id without double-counting the same pending rule
    // against both section-worklist and section-calendar in the save-bar
    // total — both buckets still land in the same b-quest-setting table.
    let calendarChanges = {};
    const calendarDeletes = new Set(); // same story as configDeletes — never populated
    // Which Status a new task starts with (default_status_id) — same
    // flat-bucket b-quest-setting shape as configChanges, but kept in its
    // own bucket so it lights up the Status section's dirty-dot instead of
    // Work List's (same reasoning as calendarChanges above).
    let statusConfigChanges = {};
    const statusConfigDeletes = new Set(); // never populated, same story as configDeletes
    // List page Data Visibility (Role/Owner Own-vs-All) and Filter Defaults
    // (Status/Type/Role pre-selected + Deadline range) — two more flat
    // b-quest-setting buckets, own dirty-dots per the same reasoning as
    // calendarChanges/statusConfigChanges above.
    let visibilityChanges = {};
    const visibilityDeletes = new Set(); // never populated, same story as configDeletes
    let filterDefaultsChanges = {};
    const filterDefaultsDeletes = new Set(); // never populated, same story as configDeletes
    // Links box — one b-quest-setting rule ('quest_links'), the whole
    // 3-slot array staged at once (order = display order).
    let linkChanges = {};
    const linkDeletes = new Set(); // never populated, same story as configDeletes
    let fdStatusFilter, fdTypeFilter; // createMultiSelect() instances for the Default Filters box
    // Notifications/Email — settings only (who SHOULD be notified). Actually
    // sending anything (resolving rules into a deduped recipient list,
    // fetching emails, handling the same person matching multiple rules)
    // is separate future work once this is wired to real trigger events.
    let originalDepartments = []; // [name, ...], loaded once from system_department table
    let notifyChanges = {}; // rule -> staged value, same flat-bucket shape as configChanges
    const notifyDeletes = new Set(); // never populated, same story as configDeletes
    let roleIdSeq = -1; // negative temp ids for unsaved new rows
    let saveBar = null;
    let allProfiles = []; // used by Notify's recipient pickers

    // ── Init ──
    async function loadPage() {
        sessionStorage.removeItem('bx_perms_bquest');
        await initLayout(B_QUEST_CONFIG);
        guardPermission();
        saveBar = createSaveBar({ label: 'B-Quest Settings', onSave: saveAll, onCancel: cancelAllChanges, onUndo: undoLastChange });
        setupFilterDefaultMultiSelects();
        setupCollapsibleSections();
        document.getElementById('fdRoleSegWrap')?.addEventListener('scroll', () => fdRoleSeg.updateFade());
        await Promise.all([loadRoles(), loadStatuses(), loadTypes(), loadAllProfiles(), loadConfig(), loadDepartments(), loadNameCleanup()]);
        renderFilterDefaultsSection(); // needs originalRoles/Statuses/Types + originalConfig, all settled by the Promise.all above
        await loadWork();
        setupCarouselFade('cfgCarousel', 'cfgCarouselWrap');
        setupCarouselFade('work-cols', 'workCarouselWrap');
        // Member page's Cleanup tab button links here as a clean URL with
        // ?tab=cleanup (not .html — Vercel's cleanUrls redirect drops query
        // strings on a .html-suffixed request) so it can land directly on
        // this in-page tab instead of always defaulting to Setting.
        if (new URLSearchParams(location.search).get('tab') === 'cleanup') switchBqsTab('cleanup');
    }

    // Phone: every Setting-tab section folds to its header so the page
    // isn't one very long scroll — only Role starts open. The classes are
    // set at any width but only the phone CSS acts on them, and a header
    // tap only toggles on a phone, so desktop is untouched. Taps on the
    // header's own controls (Add, A-Z, info, toggles) keep working.
    const PHONE_MQ = window.matchMedia('(max-width: 991.98px)');
    function setupCollapsibleSections() {
        document.querySelectorAll('#bqs-tab-config .section').forEach(section => {
            const header = section.querySelector(':scope > .section-header');
            if (!header) return;
            header.insertAdjacentHTML('beforeend', '<i class="bi bi-chevron-down section-fold-chevron"></i>');
            if (section.id !== 'section-roles') section.classList.add('is-folded');
            header.addEventListener('click', e => {
                if (!PHONE_MQ.matches || e.target.closest('button, input, label, select, a')) return;
                section.classList.toggle('is-folded');
            });
        });
    }

    // Generic left/right scroll-fade hint — shared by the Role/Status/Type
    // carousel and the Work List carousel (same .cfg-carousel-wrap CSS).
    function setupCarouselFade(scrollerId, wrapId) {
        const scroller = document.getElementById(scrollerId);
        const wrap = document.getElementById(wrapId);
        if (!scroller || !wrap) return;
        const update = () => {
            wrap.classList.toggle('fade-left', scroller.scrollLeft > 2);
            wrap.classList.toggle('fade-right', scroller.scrollLeft + scroller.clientWidth < scroller.scrollWidth - 2);
        };
        scroller.addEventListener('scroll', update);
        // Work List's content loads asynchronously after this runs, so its
        // width isn't known yet on the very first call — recheck shortly
        // after render too (renderWork() calls this again isn't needed
        // since content width settles within a frame or two of insertion).
        update();
        setTimeout(update, 300);
    }

    // Config/Cleanup in-page tabs — purely a show/hide + active-class
    // toggle. Dirty/save-bar state stays document-wide regardless of which
    // tab a .section sits under (see the CSS comment above #bqsTabs).
    function switchBqsTab(tab) {
        document.getElementById('bqsTabs').querySelectorAll('[data-bqs-tab]').forEach(b => b.classList.toggle('active', b.dataset.bqsTab === tab));
        document.getElementById('bqs-tab-config').style.display = tab === 'config' ? '' : 'none';
        document.getElementById('bqs-tab-cleanup').style.display = tab === 'cleanup' ? '' : 'none';
    }

    function guardPermission() {
        const user = getBxUser();
        if (user?.level === 'god') return;
        const perms = JSON.parse(sessionStorage.getItem('bx_perms_bquest') || 'null');
        if (!perms?.permissions?.includes('setting')) window.location.replace('b-quest-list.html');
    }

    // sectionId: which box to show the dirty-dot on (page-specific visual).
    // The pending-change COUNT shown on the shared save bar is computed
    // separately (recomputeSaveBarCount) by counting distinct changed/
    // deleted rows — a section can be called many times per edit (e.g. every
    // keystroke in a name field) without inflating the count.
    // Single source of truth for "the 4 staged-change sections" — used by
    // recomputeSaveBarCount, undoLastChange and resetSectionState so they
    // can't drift out of sync with each other (they used to each hardcode
    // their own copy of this list).
    function eachSection(fn) {
        fn('section-roles', roleChanges, roleDeletes);
        fn('section-statuses', statusChanges, statusDeletes);
        fn('section-types', typeChanges, typeDeletes);
        fn('section-worklist', workChanges, workDeletes);
        fn('section-worklist', configChanges, configDeletes); // shares the Work List box's dirty-dot — same id called twice on purpose
        fn('section-statuses', statusConfigChanges, statusConfigDeletes); // shares the Status box's dirty-dot — same id called twice on purpose
        fn('section-calendar', calendarChanges, calendarDeletes);
        fn('section-visibility', visibilityChanges, visibilityDeletes);
        fn('section-links', linkChanges, linkDeletes);
        fn('section-filterdefaults', filterDefaultsChanges, filterDefaultsDeletes);
        fn('section-notify', notifyChanges, notifyDeletes);
    }

    function markDirty(sectionId) {
        document.getElementById(sectionId).classList.add('is-dirty');
        pushUndoSnapshot();
        recomputeSaveBarCount();
    }

    function countPending(changes, deletes) {
        return new Set([...Object.keys(changes), ...deletes]).size;
    }

    function recomputeSaveBarCount() {
        if (!saveBar) return;
        let total = 0;
        eachSection((id, changes, deletes) => { total += countPending(changes, deletes); });
        saveBar.setCount(total);
    }

    // ── Undo (step-by-step, separate from Cancel which discards everything
    // at once) — every markDirty() pushes a full snapshot of the staged
    // state; Undo pops back to the previous one. Simple and guaranteed
    // correct since it doesn't need per-action-type undo logic, and this
    // data is small enough that snapshotting the whole thing each time is
    // cheap. Capped at 50 steps so it can't grow unbounded. Rapid repeated
    // calls (typing in a name field fires this on every keystroke) coalesce
    // into a single step instead of one snapshot per character, so Undo
    // steps back a whole edit at a time, not one letter at a time.
    let undoStack = [];
    let lastSnapshotAt = 0;

    function snapshotState() {
        return {
            roleChanges: JSON.parse(JSON.stringify(roleChanges)),
            statusChanges: JSON.parse(JSON.stringify(statusChanges)),
            typeChanges: JSON.parse(JSON.stringify(typeChanges)),
            workChanges: JSON.parse(JSON.stringify(workChanges)),
            configChanges: JSON.parse(JSON.stringify(configChanges)),
            statusConfigChanges: JSON.parse(JSON.stringify(statusConfigChanges)),
            calendarChanges: JSON.parse(JSON.stringify(calendarChanges)),
            visibilityChanges: JSON.parse(JSON.stringify(visibilityChanges)),
            linkChanges: JSON.parse(JSON.stringify(linkChanges)),
            filterDefaultsChanges: JSON.parse(JSON.stringify(filterDefaultsChanges)),
            notifyChanges: JSON.parse(JSON.stringify(notifyChanges)),
            roleDeletes: [...roleDeletes],
            statusDeletes: [...statusDeletes],
            typeDeletes: [...typeDeletes],
            workDeletes: [...workDeletes]
        };
    }

    function applySnapshot(snap) {
        roleChanges = snap.roleChanges;
        statusChanges = snap.statusChanges;
        typeChanges = snap.typeChanges;
        workChanges = snap.workChanges;
        configChanges = snap.configChanges;
        statusConfigChanges = snap.statusConfigChanges;
        calendarChanges = snap.calendarChanges;
        visibilityChanges = snap.visibilityChanges;
        linkChanges = snap.linkChanges;
        filterDefaultsChanges = snap.filterDefaultsChanges;
        notifyChanges = snap.notifyChanges;
        roleDeletes = new Set(snap.roleDeletes);
        statusDeletes = new Set(snap.statusDeletes);
        typeDeletes = new Set(snap.typeDeletes);
        workDeletes = new Set(snap.workDeletes);
    }

    function pushUndoSnapshot() {
        const now = Date.now();
        if (undoStack.length && now - lastSnapshotAt < 600) {
            undoStack[undoStack.length - 1] = snapshotState(); // coalesce into the in-progress step
        } else {
            undoStack.push(snapshotState());
            if (undoStack.length > 50) undoStack.shift();
        }
        lastSnapshotAt = now;
        saveBar?.setUndoAvailable(undoStack.length > 0);
    }

    function undoLastChange() {
        if (!undoStack.length) return;
        undoStack.pop(); // discard the state we're undoing away from
        applySnapshot(undoStack.length ? undoStack[undoStack.length - 1] : snapshotOfEmptyState());
        lastSnapshotAt = 0; // next edit should start a new step, not coalesce into this restore

        // section-worklist is fed by two different buffers (workChanges and
        // configChanges), so this can't be a plain toggle per call — the
        // second call would blindly overwrite the first's verdict. Clear
        // everything first, then only re-add where something's pending.
        document.querySelectorAll('.section').forEach(el => el.classList.remove('is-dirty'));
        eachSection((id, changes, deletes) => {
            if (countPending(changes, deletes) > 0) document.getElementById(id).classList.add('is-dirty');
        });

        renderRoles(); renderStatuses(); renderTypes(); renderWork(); renderWorkConfigToggles(); renderWorkCalendar(); renderVisibilitySection(); renderLinksSection(); renderFilterDefaultsSection(); renderNotifySection();
        recomputeSaveBarCount();
        saveBar.setUndoAvailable(undoStack.length > 0);
    }

    function snapshotOfEmptyState() {
        return {
            roleChanges: {}, statusChanges: {}, typeChanges: {}, workChanges: {}, configChanges: {}, statusConfigChanges: {}, calendarChanges: {}, visibilityChanges: {}, linkChanges: {}, filterDefaultsChanges: {}, notifyChanges: {},
            roleDeletes: [], statusDeletes: [], typeDeletes: [], workDeletes: []
        };
    }

    function resetSectionState() {
        roleChanges = {}; statusChanges = {}; typeChanges = {}; workChanges = {}; configChanges = {}; statusConfigChanges = {}; calendarChanges = {}; visibilityChanges = {}; linkChanges = {}; filterDefaultsChanges = {}; notifyChanges = {};
        roleDeletes = new Set(); statusDeletes = new Set(); typeDeletes = new Set(); workDeletes = new Set();
        undoStack = [];
        saveBar?.setUndoAvailable(false);
        eachSection(id => document.getElementById(id).classList.remove('is-dirty'));
    }

    function clearDirty() {
        resetSectionState();
        saveBar.clear();
    }

    // Cancel button on the shared save bar — revert every staged edit/
    // delete back to what's already saved, without touching the server.
    function cancelAllChanges() {
        resetSectionState();
        renderRoles();
        renderStatuses();
        renderTypes();
        renderWork();
        renderWorkConfigToggles();
        renderWorkCalendar();
        renderVisibilitySection();
        renderLinksSection();
        renderFilterDefaultsSection();
        renderNotifySection();
    }

    // Newly-added rows are blank and need a name typed in right away —
    // jump straight to it instead of leaving the user to find and click the
    // row themselves. Matters most in Work List, where a long column pushes
    // the new row below the fold and it's easy to lose track of where it
    // landed. rAF waits one frame so the just-rendered row has a layout to
    // scroll to.
    function focusNewRow(id, inputSelector) {
        requestAnimationFrame(() => {
            const el = document.querySelector(`[data-id="${CSS.escape(id)}"] ${inputSelector}`);
            if (el) { el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); el.focus(); }
        });
    }

    // ═══════════════════════════════════════════
    // Roles
    // ═══════════════════════════════════════════
    async function loadRoles() {
        const { data } = await supabaseClient.from('b_quest_role').select('*').order('sort_order');
        originalRoles = data || [];
        renderRoles();
    }

    function roleBuffer() {
        return originalRoles.map(r => ({ ...r, ...(roleChanges[r.id] || {}), _deleted: roleDeletes.has(r.id) }))
            .concat(Object.entries(roleChanges).filter(([id]) => id.startsWith('new-')).map(([id, c]) => ({ id, ...c, _new: true })))
            .sort((a, b) => (a.sort_order ?? 999) - (b.sort_order ?? 999));
    }

    function renderRoles() {
        const list = roleBuffer();
        document.getElementById('role-count').textContent = list.filter(r => !r._deleted).length;
        const container = document.getElementById('role-list');
        if (!list.length) { container.innerHTML = '<div class="cfg-empty">No roles yet</div>'; return; }

        container.innerHTML = list.map((r, i) => `
            <div class="cfg-row ${r._new ? 'is-new' : ''} ${r._deleted ? 'is-deleted' : ''} ${r.active === false ? 'is-inactive' : ''}" data-id="${r.id}"
                 draggable="${!r._deleted}"
                 ondragstart="dragStart(event, 'role', '${r.id}')" ondragend="dragEnd(event)"
                 ondragover="event.preventDefault()" ondragenter="dragEnterRow(event, 'role', '${r.id}')" ondragleave="dragLeaveRow(event)"
                 ondrop="dropOnRow(event, 'role', '${r.id}')">
                <div class="cfg-drag-handle cfg-col-drag"><i class="bi bi-grip-vertical"></i>${moveBtns('role', r.id)}</div>
                <div class="cfg-col-color"><div class="cfg-swatch" style="background:${r.color || '#94a3b8'}" onclick="openColorPicker(this, { getValue: () => roleBuffer().find(x => x.id === '${r.id}')?.color || '#94a3b8', onSelect: (c) => onRoleField('${r.id}', 'color', c) })"></div></div>
                <div class="cfg-col-icon"><div class="cfg-icon-swatch" onclick="openIconPicker(event, 'role', '${r.id}')"><i class="bi ${r.icon || 'bi-person-workspace'}"></i></div></div>
                <input class="cfg-name-input cfg-col-name" value="${esc(r.name)}" oninput="onRoleField('${r.id}', 'name', this.value)">
                <div class="cfg-cap-wrap cfg-col-cap">
                    <input type="number" class="cfg-cap-input" min="0" max="999" step="0.01" inputmode="decimal" value="${r.max_capacity ?? ''}" oninput="onRoleField('${r.id}', 'max_capacity', this.value === '' ? null : parseFloat(this.value))">
                </div>
                <div class="cfg-mini-toggle-wrap cfg-col-toggle">
                    <label class="bq-toggle small">
                        <input type="checkbox" ${r.active !== false ? 'checked' : ''} onchange="onRoleField('${r.id}', 'active', this.checked)">
                        <span class="bq-slider"></span>
                    </label>
                </div>
                <div class="cfg-flex-spacer cfg-col-trash">
                    ${r._deleted
                        ? `<button class="cfg-btn-undo" onclick="undoRemoveRole('${r.id}')" title="Undo delete"><i class="bi bi-arrow-counterclockwise"></i></button>`
                        : `<button class="cfg-btn-del" onclick="removeRole('${r.id}')" title="Delete"><i class="bi bi-trash3"></i></button>`}
                </div>
            </div>
        `).join('');
    }

    function onRoleField(id, field, value) {
        if (!roleChanges[id]) roleChanges[id] = {};
        roleChanges[id][field] = value;
        markDirty('section-roles');
        if (field !== 'name') renderRoles();
    }

    function addRole() {
        const id = `new-${roleIdSeq--}`;
        const buf = roleBuffer();
        const maxOrder = Math.max(0, ...buf.map(r => r.sort_order || 0));
        roleChanges[id] = { name: '', color: nextAutoColor(buf.map(r => r.color)), icon: randomIcon(), max_capacity: 10, sort_order: maxOrder + 1, active: true };
        markDirty('section-roles');
        renderRoles();
        focusNewRow(id, '.cfg-name-input');
    }

    // Deleting just stages it (strikethrough + Undo) — the row isn't gone
    // for real until Save, matching every other pending change here.
    function removeRole(id) {
        if (id.startsWith('new-')) { delete roleChanges[id]; }
        else { roleDeletes.add(id); }
        markDirty('section-roles');
        renderRoles();
    }

    function undoRemoveRole(id) {
        roleDeletes.delete(id);
        markDirty('section-roles');
        renderRoles();
    }

    let roleDeletes = new Set();

    // ═══════════════════════════════════════════
    // Statuses
    // ═══════════════════════════════════════════
    async function loadStatuses() {
        const { data } = await supabaseClient.from('b_quest_status').select('*').order('sort_order');
        originalStatuses = data || [];
        renderStatuses();
    }

    function statusBuffer() {
        return originalStatuses.map(s => ({ ...s, ...(statusChanges[s.id] || {}), _deleted: statusDeletes.has(s.id) }))
            .concat(Object.entries(statusChanges).filter(([id]) => id.startsWith('new-')).map(([id, c]) => ({ id, ...c, _new: true })))
            .sort((a, b) => (a.sort_order ?? 999) - (b.sort_order ?? 999));
    }

    function statusConfigBuffer() {
        return { ...originalConfig, ...statusConfigChanges };
    }

    // There must always be exactly one Default — if none was ever set, or
    // the configured one got deleted/deactivated in this edit session, this
    // falls back to the first remaining eligible Status (sort_order'd,
    // same order shown in the list) rather than leaving no star lit.
    // Prefers an already-saved row (real id, can go straight into
    // default_status_id), but if NOTHING is saved yet — e.g. the very
    // first Status ever added — falls back to the first unsaved (new-*)
    // one instead, so it still shows starred; saveAll swaps in the real id
    // once that row is actually inserted (see there).
    function resolveDefaultStatusId(list) {
        const configured = statusConfigBuffer().default_status_id;
        const real = list.filter(s => !s._deleted && s.active !== false && !s._new);
        if (real.some(s => s.id === configured)) return configured;
        if (real.length) return real[0].id;
        const unsaved = list.filter(s => !s._deleted && s.active !== false && s._new);
        return unsaved[0]?.id ?? null;
    }

    function onSetDefaultStatus(id) {
        statusConfigChanges.default_status_id = id;
        markDirty('section-statuses');
        renderStatuses();
    }

    function renderStatuses() {
        const list = statusBuffer();
        document.getElementById('status-count').textContent = list.filter(s => !s._deleted).length;
        const container = document.getElementById('status-list');
        if (!list.length) { container.innerHTML = '<div class="cfg-empty">No statuses yet</div>'; return; }

        const defaultId = resolveDefaultStatusId(list);

        container.innerHTML = list.map((s, i) => `
            <div class="cfg-row ${s._new ? 'is-new' : ''} ${s._deleted ? 'is-deleted' : ''} ${s.active === false ? 'is-inactive' : ''}" data-id="${s.id}"
                 draggable="${!s._deleted}"
                 ondragstart="dragStart(event, 'status', '${s.id}')" ondragend="dragEnd(event)"
                 ondragover="event.preventDefault()" ondragenter="dragEnterRow(event, 'status', '${s.id}')" ondragleave="dragLeaveRow(event)"
                 ondrop="dropOnRow(event, 'status', '${s.id}')">
                <div class="cfg-drag-handle cfg-col-drag"><i class="bi bi-grip-vertical"></i>${moveBtns('status', s.id)}</div>
                <div class="cfg-col-color"><div class="cfg-swatch" style="background:${s.color || '#94a3b8'}" onclick="openColorPicker(this, { getValue: () => statusBuffer().find(x => x.id === '${s.id}')?.color || '#94a3b8', onSelect: (c) => onStatusField('${s.id}', 'color', c) })"></div></div>
                <input class="cfg-name-input cfg-col-name" value="${esc(s.name)}" oninput="onStatusField('${s.id}', 'name', this.value)">
                <div class="cfg-col-star">
                    <button type="button" class="cfg-star-btn ${s.id === defaultId ? 'is-default' : ''}"
                        ${s._new || s._deleted || s.active === false ? 'disabled' : ''}
                        onclick="onSetDefaultStatus('${s.id}')"
                        title="${s.id === defaultId ? 'Default status for new tasks' : 'Set as default'}">
                        <i class="bi ${s.id === defaultId ? 'bi-star-fill' : 'bi-star'}"></i>
                    </button>
                </div>
                <div class="cfg-mini-toggle-wrap cfg-col-toggle">
                    <label class="bq-toggle small">
                        <input type="checkbox" ${s.active !== false ? 'checked' : ''} onchange="onStatusField('${s.id}', 'active', this.checked)">
                        <span class="bq-slider"></span>
                    </label>
                </div>
                <div class="cfg-flex-spacer cfg-col-trash">
                    ${s._deleted
                        ? `<button class="cfg-btn-undo" onclick="undoRemoveStatus('${s.id}')" title="Undo delete"><i class="bi bi-arrow-counterclockwise"></i></button>`
                        : `<button class="cfg-btn-del" onclick="removeStatus('${s.id}')" title="Delete"><i class="bi bi-trash3"></i></button>`}
                </div>
            </div>
        `).join('');
    }

    function onStatusField(id, field, value) {
        if (!statusChanges[id]) statusChanges[id] = {};
        statusChanges[id][field] = value;
        markDirty('section-statuses');
        if (field !== 'name') renderStatuses();
    }

    function addStatus() {
        const id = `new-${roleIdSeq--}`;
        const buf = statusBuffer();
        const maxOrder = Math.max(0, ...buf.map(s => s.sort_order || 0));
        statusChanges[id] = { name: '', color: nextAutoColor(buf.map(s => s.color)), sort_order: maxOrder + 1, active: true };
        markDirty('section-statuses');
        renderStatuses();
        focusNewRow(id, '.cfg-name-input');
    }

    let statusDeletes = new Set();

    function removeStatus(id) {
        if (id.startsWith('new-')) { delete statusChanges[id]; }
        else { statusDeletes.add(id); }
        markDirty('section-statuses');
        renderStatuses();
    }

    function undoRemoveStatus(id) {
        statusDeletes.delete(id);
        markDirty('section-statuses');

    function typeBuffer() {
        return originalTypes.map(t => ({ ...t, ...(typeChanges[t.id] || {}), _deleted: typeDeletes.has(t.id) }))

            .sort((a, b) => (a.sort_order ?? 999) - (b.sort_order ?? 999));

    function removeType(id) {

    // ═══════════════════════════════════════════
    // Drag & drop reordering (Roles / Statuses / Types / Work — shared)
    // Reorder is only computed on "drop" (native DnD is fragile if the
    // dragged DOM node gets replaced mid-drag via innerHTML re-render);
    // dragenter/dragleave just toggle a highlight class, no re-render.
    // ═══════════════════════════════════════════
    let dragState = null; // { kind: 'role'|'status'|'work', id, roleId (work only) }

    function dragStart(e, kind, id, roleId) {
        dragState = { kind, id, roleId };
        e.currentTarget.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', id);
    }

    function dragEnd(e) {
        e.currentTarget.classList.remove('dragging');
        document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
        dragState = null;
    }

    function dragEnterRow(e, kind, id, roleId) {
        if (!dragState || dragState.kind !== kind || dragState.id === id) return;
        if (kind === 'work' && dragState.roleId !== roleId) return;
        e.currentTarget.classList.add('drag-over');
    }

    function dragLeaveRow(e) {
        e.currentTarget.classList.remove('drag-over');
    }

    function reorderList(list, fromId, toId) {
        const fromIdx = list.findIndex(x => x.id === fromId);
        const toIdx = list.findIndex(x => x.id === toId);
        if (fromIdx === -1 || toIdx === -1) return list;
        const [moved] = list.splice(fromIdx, 1);
        list.splice(toIdx, 0, moved);
        return list;
    }

    function dropOnRow(e, kind, id, roleId) {
        e.preventDefault();
        e.currentTarget.classList.remove('drag-over');
        if (!dragState || dragState.kind !== kind || dragState.id === id) { dragState = null; return; }
        if (kind === 'work' && dragState.roleId !== roleId) { dragState = null; return; }
        applyReorder(kind, dragState.id, id, roleId);
        dragState = null;
    }

    // Each list in the order it's displayed — what a drop or a ▲/▼ move
    // reorders. Work rows render sorted by sort_order within their role.
    function reorderableList(kind, roleId) {
        if (kind === 'role') return roleBuffer();
        if (kind === 'status') return statusBuffer();
        if (kind === 'type') return typeBuffer();
        if (kind === 'work') return workBuffer().filter(w => w.role_id === roleId).sort((a, b) => (a.sort_order ?? 999) - (b.sort_order ?? 999));
        if (kind === 'link') return linkBuffer().map(l => ({ ...l, id: String(l.slot) }));
        return [];
    }

    // Moves fromId to toId's position and stages the new order — shared by
    // drag-and-drop and the phone ▲/▼ buttons.
    function applyReorder(kind, fromId, toId, roleId) {
        const list = reorderList(reorderableList(kind, roleId), fromId, toId);
        if (kind === 'role') {
            list.forEach((r, i) => { (roleChanges[r.id] ||= {}).sort_order = i + 1; });
            markDirty('section-roles'); renderRoles();
        } else if (kind === 'status') {
            list.forEach((s, i) => { (statusChanges[s.id] ||= {}).sort_order = i + 1; });
            markDirty('section-statuses'); renderStatuses();
        } else if (kind === 'type') {
            list.forEach((t, i) => { (typeChanges[t.id] ||= {}).sort_order = i + 1; });
            markDirty('section-types'); renderTypes();
        } else if (kind === 'work') {
            list.forEach((w, i) => { (workChanges[w.id] ||= {}).sort_order = i + 1; });
            markDirty('section-worklist'); renderWork();
        } else if (kind === 'link') {
            linkChanges.quest_links = list.map(({ slot, label, active }) => ({ slot, label, active }));
            markDirty('section-links'); renderLinksSection();
        }
    }

    // ▲/▼ pair inside each row's drag handle. HTML5 drag-and-drop doesn't
    // work with a finger on iOS, so the phone CSS hides the grip and shows
    // these instead; desktop keeps dragging and never sees them.
    function moveBtns(kind, id, roleId = '') {
        const args = `'${kind}', '${id}', '${roleId}'`;
        return `<span class="cfg-move">
            <button type="button" onclick="moveRow(${args}, -1)" title="Move up"><i class="bi bi-chevron-up"></i></button>
            <button type="button" onclick="moveRow(${args}, 1)" title="Move down"><i class="bi bi-chevron-down"></i></button>
        </span>`;
    }

    function moveRow(kind, id, roleId, dir) {
        const list = reorderableList(kind, roleId || undefined);
        const idx = list.findIndex(x => x.id === id);
        const neighbor = list[idx + dir];
        if (idx === -1 || !neighbor) return;
        applyReorder(kind, id, neighbor.id, roleId || undefined);
    }

    // One-click "reset to alphabetical" — reassigns sort_order by name,
    // staged like any other change (confirmed on Save, not immediate).
    function sortAlpha(kind) {
        const bufFn = { role: roleBuffer, status: statusBuffer, type: typeBuffer }[kind];
        const changesObj = { role: roleChanges, status: statusChanges, type: typeChanges }[kind];
        const sectionId = { role: 'section-roles', status: 'section-statuses', type: 'section-types' }[kind];
        const renderFn = { role: renderRoles, status: renderStatuses, type: renderTypes }[kind];
        if (!bufFn) return;

        const list = bufFn().filter(x => !x._deleted)
            .sort((a, b) => (a.name || '').localeCompare(b.name || '', undefined, { sensitivity: 'base' }));
        list.forEach((item, i) => { (changesObj[item.id] ||= {}).sort_order = i + 1; });
        markDirty(sectionId);
        renderFn();
    }

    // ═══════════════════════════════════════════
    // Color / Icon pickers (separate — icon only applies to Roles)
    // ═══════════════════════════════════════════
    let pickerTarget = null; // { kind: 'role'|'status', id }

    function positionPicker(evt) {
        const panel = document.getElementById('picker-panel');
        // Backdrop must be shown before we measure the panel — its width is
        // otherwise 0 (display:none ancestor), which used to make the
        // horizontal-overflow check below a no-op. Safe to show first:
        // top/left/bottom all get set synchronously right after, in the
        // same tick, before the browser paints anything.
        document.getElementById('picker-backdrop').classList.add('show');
        lockBodyScroll();
        const rect = evt.currentTarget.getBoundingClientRect();
        // .cfg-picker is absolutely positioned inside the fixed backdrop, so its
        // containing block is the viewport itself — use viewport-relative
        // coordinates from getBoundingClientRect() directly, no scroll offset.
        // Flip above the trigger (and cap height to whatever room actually
        // exists) when there isn't enough space below — a tall popup (e.g.
        // the column filter's sort+search+checklist) used to just render
        // past the bottom of the viewport with no way to reach the rest.
        const margin = 8;
        const spaceBelow = window.innerHeight - rect.bottom - margin;
        const spaceAbove = rect.top - margin;
        if (spaceBelow >= 200 || spaceBelow >= spaceAbove) {
            panel.style.top = (rect.bottom + 6) + 'px';
            panel.style.bottom = 'auto';
            panel.style.maxHeight = Math.max(150, spaceBelow - 6) + 'px';
        } else {
            panel.style.top = 'auto';
            panel.style.bottom = (window.innerHeight - rect.top + 6) + 'px';
            panel.style.maxHeight = Math.max(150, spaceAbove - 6) + 'px';
        }
        // Flip to the trigger's right edge (clamped to the viewport) instead
        // of always opening from its left edge, when opening left-aligned
        // would run the panel off the right side of the screen — e.g. the
        // Default Filters info button sits far enough right that its
        // .medium (330px) panel used to overflow with no way to read the
        // clipped text.
        const panelWidth = panel.offsetWidth;
        let left = rect.left;
        if (left + panelWidth > window.innerWidth - margin) {
            left = Math.max(margin, rect.right - panelWidth);
        }
        panel.style.left = left + 'px';
    }

    // List page — Data Visibility (Role/Owner Own-vs-All)
    // ═══════════════════════════════════════════
    function visibilityBuffer() {
        return { role: 'all', owner: 'all', ...originalConfig.list_visibility, ...visibilityChanges.list_visibility };
    }

    function renderVisibilitySection() {
        const v = visibilityBuffer();
        ['role', 'owner'].forEach(axis => {

    function onVisibilitySegClick(e, axis) {
        const btn = e.target.closest('button');
